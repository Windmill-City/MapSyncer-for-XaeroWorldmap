plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'com.gradleup.shadow' version '8.3.5'
    id 'maven-publish'
}

version = mod_version + '-forge-' + g1_jar_suffix
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_1201_version}-${forge_1201_version}"

    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.lz4:lz4-java:1.8.0'

    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_range_forge", g1_minecraft_range_forge

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version,
                "minecraft_range_forge": g1_minecraft_range_forge
    }
}

apply from: rootProject.file('gradle/lz4-relocate.gradle')

configurations {

    bundle

    packagerLogging {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    bundle 'org.lz4:lz4-java:1.8.0'
    packagerLogging 'org.slf4j:slf4j-simple:2.0.9'
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.bundle]
    configureLz4Shadow(it)
    configureLz4ShadowExcludes(it)
}

tasks.named('jar') {
    archiveClassifier.set('slim')
    dependsOn shadowJar
}

tasks.named('jarJar') {
    enabled = false
}

def packagerMainClass = 'com.mapsyncer.tool.MapPackager'

tasks.register('mapPackagerJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveClassifier = ''
    archiveBaseName = 'mapsyncer-packager'
    archiveVersion = mod_version
    destinationDirectory = layout.buildDirectory.dir('dist')

    manifest {
        attributes 'Main-Class': packagerMainClass
    }

    from(sourceSets.main.output) {
        include 'com/mapsyncer/tool/MapPackager*.class'
        include 'com/mapsyncer/util/HashUtils*.class'
        include 'com/mapsyncer/util/PropertiesCacheIO*.class'
    }
    configurations = [project.configurations.packagerLogging]

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/versions/9/module-info.class'

    zip64 = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('mapPackagerDist', Zip) {
    dependsOn mapPackagerJar

    archiveFileName = "mapsyncer-packager-${mod_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')

    from(mapPackagerJar.archiveFile) {
        into '.'
    }

    doLast {
        logger.lifecycle("MapPackager 发布包: ${archiveFile.get().asFile.absolutePath}")
    }
}

tasks.register('collectJars', Copy) {
    description = '将所有构建产物 JAR 收集到 output 目录'
    group = 'distribution'
    into layout.projectDirectory.dir('output')
    from(layout.buildDirectory.dir('libs')) {
        include '*.jar'
        exclude '*-slim.jar', '*-sources.jar', '*-javadoc.jar'
    }
    outputs.upToDateWhen { false }
}

tasks.register('buildAll') {
    dependsOn 'build'
    finalizedBy 'collectJars'
}

tasks.register('buildPackager') {
    description = '构建 MapPackager 打包工具并输出到 output 目录'
    group = 'distribution'
    dependsOn 'mapPackagerDist'
    doLast {
        copy {
            from(layout.buildDirectory.dir('dist')) {
                include 'mapsyncer-packager-*.zip'
            }
            into layout.projectDirectory.dir('output')
        }
        logger.lifecycle('MapPackager 产物已输出到 output/ 目录')
    }
}

publishing {
    publications {
        register('forge120MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
